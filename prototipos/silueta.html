<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selector de Zonas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Figura anatómica limpia; la selección vive en una tarjeta flotante junto al puntero. Colores provisionales. */
:root {
  --bg: #f1efea; --surface: #ffffff; --line: #d6d1c7; --fg: #1b1c1d; --muted: #6b6a64; --accent: #9a7428; --accent-fg: #fff;
  --body: #cfcac0; --muscle: #bdb7ab; --muscle-hover: #a9a294; --sel: #b8892e; --prio: #e0a93a; --edge: #f1efea;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 10px 30px rgb(0 0 0 / .15);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f10; --surface: #171a1c; --line: #2c3135; --fg: #ece8e1; --muted: #9b9a93; --accent: #c9a25b; --accent-fg: #15130f;
  --body: #2b3135; --muscle: #343b40; --muscle-hover: #455058; --sel: #c9a25b; --prio: #f2c879; --edge: #0d0f10;
  --shadow: 0 12px 34px rgb(0 0 0 / .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d0f10; --surface: #171a1c; --line: #2c3135; --fg: #ece8e1; --muted: #9b9a93; --accent: #c9a25b; --accent-fg: #15130f;
  --body: #2b3135; --muscle: #343b40; --muscle-hover: #455058; --sel: #c9a25b; --prio: #f2c879; --edge: #0d0f10;
  --shadow: 0 12px 34px rgb(0 0 0 / .55); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--text);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1; text-transform: uppercase; margin: 0; }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

.layout { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Atajos */
.presets { display: flex; flex-direction: column; gap: 4px; }
.presets .label { margin-bottom: 6px; }
.preset { text-align: left; border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.preset:hover { color: var(--fg); }
.preset[aria-pressed="true"] { color: var(--fg); background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
@media (max-width: 760px) {
  .presets { flex-direction: row; flex-wrap: wrap; gap: 6px; } .presets .label { width: 100%; margin: 0; }
  .preset { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .preset[aria-pressed="true"] { box-shadow: none; border-color: var(--accent); }
}

/* Figura */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.views { display: flex; gap: 12px; justify-content: center; width: 100%; }
.fig { flex: 1 1 0; max-width: 300px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fig svg { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.view-name { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.toggle { display: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: transparent; padding: 8px 18px; font-weight: 600; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 560px) {
  .toggle { display: inline-flex; } .fig { max-width: 330px; }
  .stage[data-view="front"] .fig[data-view="back"], .stage[data-view="back"] .fig[data-view="front"] { display: none; }
}

.part { fill: var(--body); stroke: var(--edge); stroke-width: 2; }
.m { fill: var(--muscle); stroke: var(--edge); stroke-width: 2; cursor: pointer; transition: fill .2s ease; }
.m.hover { fill: var(--muscle-hover); }
.m.on { fill: var(--sel); }
.m.prio { fill: var(--prio); }
.m.on.hover { fill: var(--prio); }

/* Etiqueta que sigue al puntero */
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--fg); color: var(--bg); font-size: .8rem; font-weight: 600;
  padding: 4px 9px; border-radius: 6px; transform: translate(14px, -50%); white-space: nowrap; }

/* Tarjeta flotante de la zona */
.pop { position: fixed; z-index: 40; width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pop-close { border: 0; background: transparent; color: var(--muted); font-size: .85rem; padding: 2px 4px; }
.subs { display: flex; flex-direction: column; gap: 4px; }
.sub { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.sub-toggle { display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 7px 6px; border-radius: 6px; font-weight: 600; font-size: .95rem; }
.sub-toggle:hover { background: var(--bg); }
.sub-toggle::before { content: ""; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--muted); flex: none; }
.sub-toggle[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent);
  box-shadow: inset 0 0 0 3px var(--surface); }
.sub-toggle[aria-pressed="false"] { color: var(--muted); }
.star { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 700; color: var(--muted); }
.star[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.star:disabled { opacity: .35; cursor: not-allowed; }
.pop-foot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.pop-note { font-size: .74rem; color: var(--muted); }
@media (pointer: coarse) { .pop-note { display: none; } }
.link { border: 0; background: transparent; color: var(--muted); font-size: .85rem; padding: 4px 2px; }
.done { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 700; padding: 6px 16px; }
@media (max-width: 640px) {
  .pop { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; border-radius: 16px 16px 0 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tip { display: none; }
}

/* Selección (solo aparece cuando hay algo escogido) */
.picked { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; }
.chip small { color: var(--accent); font-weight: 700; margin-left: 4px; }
.next { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); padding: 10px 22px; font-family: var(--display); font-weight: 800; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; }
.credit { font-size: .72rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .m { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <span class="label">Paso 2 de 4 · Zona</span>
    <h1>¿Qué vas a trabajar?</h1>
  </div>

  <div class="layout">
    <div class="presets" id="presets" role="group" aria-label="Atajos"><span class="label">Atajos</span></div>

    <div class="stage" id="stage" data-view="front">
      <div class="toggle" role="group" aria-label="Vista">
        <button data-view="front" aria-pressed="true">Frente</button>
        <button data-view="back" aria-pressed="false">Espalda</button>
      </div>
      <div class="views">
        <div class="fig" data-view="front"><svg id="svg-front" viewBox="0 0 724 1448" role="img" aria-label="Cuerpo de frente"></svg><span class="view-name">Frente</span></div>
        <div class="fig" data-view="back"><svg id="svg-back" viewBox="724 0 724 1448" role="img" aria-label="Cuerpo de espalda"></svg><span class="view-name">Espalda</span></div>
      </div>
      <div class="picked" id="picked"></div>
      <div class="credit">Figura basada en react-native-body-highlighter (MIT)</div>
    </div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="pop" id="pop" hidden role="dialog" aria-modal="false"></div>

<script type="module">
import { BODY_FRONT, BODY_BACK } from "../js/data/body-paths.js";

// ───────── Zonas, subzonas y atajos ─────────
const ZONES = {
  pecho:   { nombre: "Pecho",   subs: { superior: "Superior", medio: "Medio e inferior" } },
  espalda: { nombre: "Espalda", subs: { dorsales: "Dorsales (ancho)", alta: "Espalda alta (grosor)", lumbar: "Lumbar" } },
  hombros: { nombre: "Hombros", subs: { anterior: "Anterior", lateral: "Lateral", posterior: "Posterior" } },
  brazos:  { nombre: "Brazos",  subs: { biceps: "Bíceps", triceps: "Tríceps", antebrazo: "Antebrazo" } },
  abdomen: { nombre: "Abdomen", subs: { recto: "Recto abdominal", oblicuos: "Oblicuos", estabilidad: "Estabilidad (core profundo)" } },
  piernas: { nombre: "Piernas", subs: { cuadriceps: "Cuádriceps", isquios: "Isquiotibiales", gluteos: "Glúteos", pantorrillas: "Pantorrillas", aductores: "Aductores" } },
};
const ALL = Object.fromEntries(Object.entries(ZONES).map(([z, v]) => [z, Object.keys(v.subs)]));
const PRESETS = {
  push:     { nombre: "Push",  sel: { pecho: ["superior", "medio"], hombros: ["anterior", "lateral"], brazos: ["triceps"] } },
  pull:     { nombre: "Pull",  sel: { espalda: ["dorsales", "alta"], hombros: ["posterior"], brazos: ["biceps", "antebrazo"] } },
  piernas:  { nombre: "Piernas", sel: { piernas: ALL.piernas } },
  core:     { nombre: "Core",  sel: { abdomen: ALL.abdomen, espalda: ["lumbar"] } },
  completo: { nombre: "Cuerpo completo", sel: ALL },
};

// Trazo anatómico → zona.subzona. "split" divide un músculo en dos subzonas.
const MAP = {
  front: {
    chest: { z: "pecho", split: { axis: "y", at: 0.45, a: "superior", b: "medio" } },
    deltoids: { z: "hombros", split: { axis: "x-out", at: 0.5, a: "lateral", b: "anterior" } },
    biceps: { z: "brazos", s: "biceps" }, triceps: { z: "brazos", s: "triceps" }, forearm: { z: "brazos", s: "antebrazo" },
    abs: { z: "abdomen", s: "recto" }, obliques: { z: "abdomen", s: "oblicuos" },
    quadriceps: { z: "piernas", s: "cuadriceps" }, adductors: { z: "piernas", s: "aductores" },
    tibialis: { z: "piernas", s: "pantorrillas" }, calves: { z: "piernas", s: "pantorrillas" },
    trapezius: { z: "espalda", s: "alta" },
  },
  back: {
    trapezius: { z: "espalda", s: "alta" }, "upper-back": { z: "espalda", s: "dorsales" }, "lower-back": { z: "espalda", s: "lumbar" },
    deltoids: { z: "hombros", s: "posterior" }, triceps: { z: "brazos", s: "triceps" }, forearm: { z: "brazos", s: "antebrazo" },
    gluteal: { z: "piernas", s: "gluteos" }, hamstring: { z: "piernas", s: "isquios" },
    adductors: { z: "piernas", s: "aductores" }, calves: { z: "piernas", s: "pantorrillas" },
  },
};
const CENTER_X = { front: 362, back: 1086 };   // eje del cuerpo en cada vista

// ───────── Estado ─────────
const state = { sel: {}, prio: new Set(), preset: null, open: null };
const K = (z, s) => `${z}.${s}`;
const subName = (z, s) => ZONES[z].subs[s];

// ───────── Dibujo de la figura ─────────
const NS = "http://www.w3.org/2000/svg";
function build(svg, parts, view) {
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  let clipN = 0;
  for (const part of parts) {
    const map = MAP[view][part.slug];
    const paths = [...part.left.map(d => [d, "l"]), ...part.right.map(d => [d, "r"]), ...part.common.map(d => [d, "c"])];
    for (const [d] of paths) {
      const el = document.createElementNS(NS, "path"); el.setAttribute("d", d);
      if (!map) { el.setAttribute("class", "part"); svg.appendChild(el); continue; }
      if (!map.split) { tag(el, map.z, map.s); svg.appendChild(el); continue; }
      // Dividir con dos recortes según el eje
      svg.appendChild(el); const bb = el.getBBox(); el.remove();
      [map.split.a, map.split.b].forEach((s, i) => {
        const id = `clip-${view}-${clipN++}`;
        const cp = document.createElementNS(NS, "clipPath"); cp.id = id;
        const r = document.createElementNS(NS, "rect");
        if (map.split.axis === "y") {
          const cut = bb.y + bb.height * map.split.at;
          r.setAttribute("x", bb.x - 5); r.setAttribute("width", bb.width + 10);
          r.setAttribute("y", i === 0 ? bb.y - 5 : cut); r.setAttribute("height", i === 0 ? cut - bb.y + 5 : bb.y + bb.height - cut + 5);
        } else {   // "x-out": la mitad exterior (lejos del eje del cuerpo) es la subzona a
          const cut = bb.x + bb.width * map.split.at;
          const outerIsLeft = bb.x + bb.width / 2 < CENTER_X[view];
          const leftPart = i === 0 ? outerIsLeft : !outerIsLeft;
          r.setAttribute("y", bb.y - 5); r.setAttribute("height", bb.height + 10);
          r.setAttribute("x", leftPart ? bb.x - 5 : cut); r.setAttribute("width", leftPart ? cut - bb.x + 5 : bb.x + bb.width - cut + 5);
        }
        cp.appendChild(r); defs.appendChild(cp);
        const copy = el.cloneNode(); copy.setAttribute("clip-path", `url(#${id})`); tag(copy, map.z, s);
        svg.appendChild(copy);
      });
    }
  }
}
function tag(el, z, s) {
  el.setAttribute("class", "m"); el.dataset.z = z; el.dataset.s = s;
  el.setAttribute("tabindex", "0"); el.setAttribute("role", "button");
  el.setAttribute("aria-label", `${ZONES[z].nombre}: ${subName(z, s)}`);
}
build(document.getElementById("svg-front"), BODY_FRONT, "front");
build(document.getElementById("svg-back"), BODY_BACK, "back");

// ───────── Pintar estado ─────────
function paint() {
  document.querySelectorAll(".m").forEach(el => {
    const { z, s } = el.dataset;
    const inc = (state.sel[z] ?? []).includes(s);
    // Estabilidad no tiene músculo visible: se refleja en el abdomen
    const prio = state.prio.has(K(z, s)) || (z === "abdomen" && s === "recto" && state.prio.has("abdomen.estabilidad"));
    el.classList.toggle("on", inc);
    el.classList.toggle("prio", inc && prio);
  });
  document.querySelectorAll(".preset").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === state.preset)));
  renderPicked();
  if (state.open) updatePop();
}
function samePreset() {
  const norm = sel => JSON.stringify(Object.keys(sel).filter(z => sel[z]?.length).sort().map(z => [z, [...sel[z]].sort()]));
  return Object.keys(PRESETS).find(k => norm(PRESETS[k].sel) === norm(state.sel)) ?? null;
}

function renderPicked() {
  const zones = Object.keys(ZONES).filter(z => state.sel[z]?.length);
  const el = document.getElementById("picked");
  if (!zones.length) { el.innerHTML = `<span class="muted">Toca una parte del cuerpo o escoge un atajo.</span>`; return; }
  el.innerHTML = zones.map(z => {
    const n = [...state.prio].filter(k => k.startsWith(z + ".")).length;
    return `<button class="chip" data-z="${z}">${ZONES[z].nombre}${n ? `<small>${n === 1 ? "prioridad" : n + " prioridades"}</small>` : ""}</button>`;
  }).join("") + `<button class="next">Continuar</button>`;
}

// ───────── Tarjeta flotante ─────────
const pop = document.getElementById("pop");
function renderPop(z) {
  const subs = Object.entries(ZONES[z].subs).map(([s, label]) => {
    const inc = (state.sel[z] ?? []).includes(s), pr = state.prio.has(K(z, s));
    return `<div class="sub">
      <button class="sub-toggle" data-act="sub" data-s="${s}" aria-pressed="${inc}">${label}</button>
      <button class="star" data-act="prio" data-s="${s}" aria-pressed="${pr}" ${inc ? "" : "disabled"} aria-label="Priorizar ${label}">Prioridad</button>
    </div>`;
  }).join("");
  pop.innerHTML = `<div class="pop-head"><h2>${ZONES[z].nombre}</h2><button class="pop-close" data-act="close" aria-label="Cerrar">Cerrar</button></div>
    <div class="subs">${subs}</div>
    <div class="pop-foot"><button class="link" data-act="remove">Quitar zona</button><button class="done" data-act="close">Listo</button></div>
    <span class="pop-note">Los cambios se guardan al momento. Doble clic o Supr quita la zona.</span>`;
  pop.setAttribute("aria-label", `Opciones de ${ZONES[z].nombre}`);
}
function updatePop() {
  const z = state.open.z;
  pop.querySelectorAll(".sub").forEach(row => {
    const s = row.querySelector(".sub-toggle").dataset.s;
    const inc = (state.sel[z] ?? []).includes(s);
    row.querySelector(".sub-toggle").setAttribute("aria-pressed", String(inc));
    const star = row.querySelector(".star");
    star.setAttribute("aria-pressed", String(state.prio.has(K(z, s))));
    star.disabled = !inc;
  });
}
function openPop(z, x, y) {
  state.open = { z, x, y };
  renderPop(z); pop.hidden = false;
  if (matchMedia("(max-width: 640px)").matches) { pop.style.left = ""; pop.style.top = ""; return; }
  // Junto al puntero: a la derecha si cabe, si no a la izquierda; siempre dentro de la pantalla
  const w = pop.offsetWidth, h = pop.offsetHeight, pad = 12;
  let left = x + 18; if (left + w > innerWidth - pad) left = x - w - 18;
  let top = y - 40; top = Math.max(pad, Math.min(top, innerHeight - h - pad));
  pop.style.left = `${Math.max(pad, left)}px`; pop.style.top = `${top}px`;
}
function closePop() { state.open = null; pop.hidden = true; }
const dropPrio = z => { state.prio = new Set([...state.prio].filter(k => !k.startsWith(z + "."))); };
function removeZone(z) {
  delete state.sel[z]; dropPrio(z); state.preset = samePreset();
  if (state.open?.z === z) closePop();
  paint();
}

pop.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || !state.open) return;
  const z = state.open.z, s = b.dataset.s;
  if (b.dataset.act === "close") return closePop();
  if (b.dataset.act === "remove") return removeZone(z);
  if (b.dataset.act === "sub") {
    const list = state.sel[z] ??= [];
    if (list.includes(s)) { state.sel[z] = list.filter(x => x !== s); state.prio.delete(K(z, s)); if (!state.sel[z].length) delete state.sel[z]; }
    else list.push(s);
  }
  if (b.dataset.act === "prio") state.prio.has(K(z, s)) ? state.prio.delete(K(z, s)) : state.prio.add(K(z, s));
  state.preset = samePreset(); paint();
});

// ───────── Interacción con la figura ─────────
const tip = document.getElementById("tip");
let hoverZone = null;
const wasSelected = {};
function choose(el, x, y) {
  const { z } = el.dataset;
  if (!state.sel[z]?.length) state.sel[z] = [...ALL[z]];          // tocar una zona la incluye completa
  state.preset = samePreset(); paint(); openPop(z, x, y);
}
document.querySelectorAll("svg").forEach(svg => {
  svg.addEventListener("click", e => {
    const el = e.target.closest(".m"); if (!el) return;
    if (e.detail <= 1) wasSelected[el.dataset.z] = !!state.sel[el.dataset.z]?.length;
    if (e.detail === 2) return;                      // el segundo clic lo resuelve dblclick
    choose(el, e.clientX, e.clientY);
  });
  // Doble clic sobre una zona que ya estaba escogida: se quita
  svg.addEventListener("dblclick", e => {
    const el = e.target.closest(".m"); if (!el) return;
    if (wasSelected[el.dataset.z]) removeZone(el.dataset.z);
  });
  svg.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("m")) {
      e.preventDefault(); const r = e.target.getBoundingClientRect(); choose(e.target, r.right, r.top + r.height / 2);
    }
  });
  svg.addEventListener("pointermove", e => {
    const el = e.target.closest(".m");
    document.querySelectorAll(".m.hover").forEach(p => p.classList.remove("hover"));
    if (!el || e.pointerType !== "mouse") { tip.hidden = true; return; }
    hoverZone = el.dataset.z;
    document.querySelectorAll(`.m[data-z="${el.dataset.z}"]`).forEach(p => p.classList.add("hover"));
    tip.textContent = `${ZONES[el.dataset.z].nombre} · ${subName(el.dataset.z, el.dataset.s)}`;
    tip.style.left = `${e.clientX}px`; tip.style.top = `${e.clientY}px`; tip.hidden = false;
  });
  svg.addEventListener("pointerleave", () => { hoverZone = null; tip.hidden = true; document.querySelectorAll(".m.hover").forEach(p => p.classList.remove("hover")); });
});
document.addEventListener("pointerdown", e => {
  if (!state.open) return;
  if (pop.contains(e.target) || e.target.closest(".m, .chip")) return;
  closePop();
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closePop();
  if (e.key === "Delete" || e.key === "Backspace") {
    if (e.target.closest("input, textarea")) return;
    const z = state.open?.z ?? (hoverZone && state.sel[hoverZone]?.length ? hoverZone : null) ?? document.activeElement?.dataset?.z;
    if (z && state.sel[z]?.length) { e.preventDefault(); removeZone(z); }
  }
});

document.getElementById("picked").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  e.stopPropagation(); const r = c.getBoundingClientRect(); openPop(c.dataset.z, r.left + r.width / 2, r.top - 120);
});

// Atajos
const presetsEl = document.getElementById("presets");
presetsEl.insertAdjacentHTML("beforeend", Object.entries(PRESETS).map(([k, p]) =>
  `<button class="preset" data-p="${k}" aria-pressed="false">${p.nombre}</button>`).join(""));
presetsEl.addEventListener("click", e => {
  const b = e.target.closest(".preset"); if (!b) return;
  if (state.preset === b.dataset.p) { state.sel = {}; state.preset = null; }
  else { state.sel = structuredClone(PRESETS[b.dataset.p].sel); state.preset = b.dataset.p; }
  state.prio = new Set([...state.prio].filter(k => { const [z, s] = k.split("."); return state.sel[z]?.includes(s); }));
  closePop(); paint();
});

document.querySelector(".toggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.getElementById("stage").dataset.view = b.dataset.view;
  document.querySelectorAll(".toggle button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});

paint();
</script>
</body>
</html>
