<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de Pose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cámara a la izquierda, panel de lectura grande a la derecha (apilado en móvil) */
:root{
  --bg:#eef0ec; --surface:#ffffff; --fg:#14181a; --muted:#5d6763; --line:#d5d9d4;
  --accent:#d9480f; --ok:#2b8a3e; --warn:#c92a2a; --bone:#d9480f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181d1c; --fg:#eef2ef; --muted:#93a09a; --line:#2a3230;
  --accent:#ff7a3d; --ok:#51cf66; --warn:#ff6b6b; --bone:#ff7a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181d1c; --fg:#eef2ef; --muted:#93a09a; --line:#2a3230;
  --accent:#ff7a3d; --ok:#51cf66; --warn:#ff6b6b; --bone:#ff7a3d; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  padding:24px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
h1{font:700 2.2rem/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);margin:0}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:24px;background:rgba(0,0,0,.55)}
.overlay p{max-width:36ch;margin:0}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
label.lbl{display:block;font:500 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.modes button{font:500 .95rem var(--body);padding:10px 6px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{font:700 1.1rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{display:flex;gap:16px;flex-wrap:wrap}
.metric{flex:1 1 110px}
.metric .v{font:700 3.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.metric .k{color:var(--muted);font-size:.85rem}
.cue{font:700 1.6rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;min-height:2.4em}
.cue.ok{color:var(--ok)} .cue.warn{color:var(--warn)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.checks li{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
ul.checks .st{font:500 .85rem var(--mono)}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.na{color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Prueba de Pose</h1>
  <p class="sub">Esqueleto en vivo · el video no sale de tu equipo</p>
</header>

<div class="wrap">
  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <p id="overlayText">Coloca la cámara de lado, a unos 2–3 metros, con todo tu cuerpo visible.</p>
      <button class="btn" id="startBtn">Activar cámara</button>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <label class="lbl">Ejercicio</label>
      <div class="modes" role="group" aria-label="Ejercicio">
        <button id="m-squat" aria-pressed="true" data-mode="squat">Sentadilla</button>
        <button id="m-tri" aria-pressed="false" data-mode="tri">Tríceps</button>
        <button id="m-free" aria-pressed="false" data-mode="free">Libre</button>
      </div>
      <p class="hint" id="modeHint" style="margin-top:10px"></p>
    </div>

    <div class="card">
      <div class="cue" id="cue">—</div>
      <div class="big">
        <div class="metric"><div class="v" id="reps">0</div><div class="k">Repeticiones</div></div>
        <div class="metric"><div class="v" id="angle">—</div><div class="k" id="angleLbl">Ángulo rodilla</div></div>
      </div>
    </div>

    <div class="card">
      <label class="lbl">Revisión</label>
      <ul class="checks" id="checks"></ul>
    </div>

    <div class="row">
      <button class="btn ghost" id="resetBtn">Reiniciar conteo</button>
      <button class="btn ghost" id="voiceBtn" aria-pressed="true">Voz: sí</button>
    </div>
    <p class="hint" id="status">Cargando el modelo…</p>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const statusEl = $("status");
let landmarker = null, running = false, mode = "squat", voice = true;

// Índices de MediaPipe Pose
const L = {sh:11, el:13, wr:15, hip:23, kn:25, an:27};
const R = {sh:12, el:14, wr:16, hip:24, kn:26, an:28};
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32],[0,11],[0,12]];

const HINTS = {
  squat: "Vista lateral. Cuenta cuando bajas y subes, revisa profundidad e inclinación del torso.",
  tri: "Vista lateral, extensión por encima de la cabeza o en polea. Revisa que el hombro no se mueva.",
  free: "Solo muestra el esqueleto y los ángulos principales, sin reglas."
};

// ---------- Estado por ejercicio ----------
let reps = 0, phase = "up", smooth = {}, lastSpoken = "", lastSpokenAt = 0;
let repWarnings = new Set(), triBaseline = null;
// Control de calidad: solo se cuenta con el cuerpo completo y tras una posición inicial estable
let ready = false, readySince = null, lostSince = null, phaseStart = 0;
const MIN_VIS = 0.65, READY_MS = 1000, LOST_MS = 500, MIN_DOWN_MS = 500;
const LEAN_MAX = 45; // grados del torso respecto a la vertical
const REQUIRED = { squat: s => [s.sh, s.hip, s.kn, s.an], tri: s => [s.sh, s.el, s.wr], free: () => [] };
function ema(key, v, a = 0.35){ smooth[key] = smooth[key] == null ? v : smooth[key] + a * (v - smooth[key]); return smooth[key]; }
function resetState(){
  reps = 0; phase = "up"; smooth = {}; repWarnings = new Set(); triBaseline = null;
  ready = false; readySince = null; lostSince = null; $("reps").textContent = "0";
}
function inFrame(p){ return (p.visibility ?? 0) > MIN_VIS && p.x > 0.02 && p.x < 0.98 && p.y > 0.02 && p.y < 0.98; }
function waitingChecks(text){ setChecks([["Estado", "na", text]]); }

function markLost(now){
  if (lostSince == null) lostSince = now;
  if (now - lostSince < LOST_MS) return;
  ready = false; readySince = null; phase = "up"; smooth = {}; triBaseline = null;
  const msg = mode === "squat" ? "Aléjate, necesito verte completo" : "Acomódate, necesito ver hombro, codo y muñeca";
  setCue(msg, "warn"); say(msg); waitingChecks("en pausa");
}

// Devuelve true cuando se puede evaluar el movimiento
function gate(lm, s, now){
  if (mode === "free") return true;
  if (!REQUIRED[mode](s).every(i => inFrame(lm[i]))) { markLost(now); return false; }
  lostSince = null;
  if (ready) return true;
  const startOk = mode === "squat"
    ? angle(lm[s.hip], lm[s.kn], lm[s.an]) > 160
    : angle(lm[s.sh], lm[s.el], lm[s.wr]) > 150;
  if (!startOk) {
    readySince = null;
    setCue(mode === "squat" ? "Ponte de pie para empezar" : "Extiende el brazo para empezar", "");
  } else {
    if (readySince == null) readySince = now;
    if (now - readySince >= READY_MS) { ready = true; phase = "up"; setCue("Listo, empieza", "ok"); say("Listo, empieza"); }
    else setCue("Quédate quieto…", "");
  }
  waitingChecks(ready ? "listo" : "preparando");
  return false;
}

function angle(a, b, c){ // ángulo en b
  const ab = [a.x - b.x, a.y - b.y], cb = [c.x - b.x, c.y - b.y];
  const d = Math.hypot(...ab) * Math.hypot(...cb) || 1;
  return Math.acos(Math.max(-1, Math.min(1, (ab[0]*cb[0] + ab[1]*cb[1]) / d))) * 180 / Math.PI;
}
function fromVertical(top, bottom){ // inclinación de un segmento respecto a la vertical
  return Math.abs(Math.atan2(top.x - bottom.x, bottom.y - top.y)) * 180 / Math.PI;
}
function bestSide(lm){
  const vis = s => [s.sh, s.el, s.wr, s.hip, s.kn, s.an].reduce((t, i) => t + (lm[i].visibility ?? 0), 0);
  return vis(L) >= vis(R) ? L : R;
}
function say(text){
  if (!voice || !("speechSynthesis" in window)) return;
  const now = performance.now();
  if (text === lastSpoken && now - lastSpokenAt < 4000) return;
  lastSpoken = text; lastSpokenAt = now;
  const u = new SpeechSynthesisUtterance(text); u.lang = "es-ES"; u.rate = 1.05;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function setCue(text, kind){ const c = $("cue"); c.textContent = text; c.className = "cue " + (kind || ""); }
function setChecks(items){
  $("checks").innerHTML = items.map(([name, state, val]) =>
    `<li><span>${name}</span><span class="st ${state}">${val}</span></li>`).join("");
}

// ---------- Reglas ----------
function evalSquat(lm, s, now){
  const knee = ema("knee", angle(lm[s.hip], lm[s.kn], lm[s.an]));
  const trunk = ema("trunk", fromVertical(lm[s.sh], lm[s.hip]));
  const depthGap = lm[s.kn].y - lm[s.hip].y; // >0: cadera por encima de la rodilla (imagen con y hacia abajo)
  $("angle").textContent = Math.round(knee) + "°"; $("angleLbl").textContent = "Ángulo rodilla";

  const deep = depthGap < 0.03;
  const leanBad = trunk > LEAN_MAX;
  if (phase === "up" && knee < 110) { phase = "down"; phaseStart = now; repWarnings = new Set(); }
  if (phase === "down") {
    if (leanBad && !repWarnings.has("lean")) { repWarnings.add("lean"); setCue("Pecho arriba", "warn"); say("Pecho arriba"); }
    if (knee < 100 && deep) repWarnings.add("deepOK");
    if (knee > 160) {
      phase = "up";
      if (now - phaseStart < MIN_DOWN_MS) { setCue("Muy rápido, no cuenta", "warn"); }
      else {
        reps++; $("reps").textContent = reps;
        if (!repWarnings.has("deepOK")) { setCue("Baja más", "warn"); say("Baja un poco más"); }
        else if (repWarnings.has("lean")) { setCue("Cuenta, pero mantén el pecho arriba", "warn"); say(String(reps)); }
        else { setCue("Buena repetición", "ok"); say(String(reps)); }
      }
    }
  }
  setChecks([
    ["Profundidad (cadera ≈ rodilla)", deep ? "ok" : "na", deep ? "OK" : "aún no"],
    ["Inclinación del torso", leanBad ? "warn" : "ok", Math.round(trunk) + "°"],
    ["Fase", "na", phase === "down" ? "bajando" : "arriba"]
  ]);
}

function evalTri(lm, s, now){
  const elbow = ema("elbow", angle(lm[s.sh], lm[s.el], lm[s.wr]));
  const upper = ema("upper", fromVertical(lm[s.el], lm[s.sh]) );
  $("angle").textContent = Math.round(elbow) + "°"; $("angleLbl").textContent = "Ángulo codo";

  if (phase === "up" && elbow < 90) { phase = "down"; phaseStart = now; triBaseline = upper; repWarnings = new Set(); }
  const drift = triBaseline == null ? 0 : Math.abs(upper - triBaseline);
  if (phase === "down") {
    if (drift > 15 && !repWarnings.has("shoulder")) { repWarnings.add("shoulder"); setCue("Hombro quieto", "warn"); say("Hombro quieto"); }
    if (elbow > 150) {
      phase = "up"; triBaseline = null;
      if (now - phaseStart < MIN_DOWN_MS) { setCue("Muy rápido, no cuenta", "warn"); }
      else {
        reps++; $("reps").textContent = reps;
        if (repWarnings.has("shoulder")) setCue("Cuenta, pero mueve solo el codo", "warn");
        else setCue("Buena repetición", "ok");
        say(String(reps));
      }
    }
  }
  setChecks([
    ["Movimiento del hombro", drift > 15 ? "warn" : "ok", Math.round(drift) + "°"],
    ["Extensión completa", elbow > 150 ? "ok" : "na", elbow > 150 ? "OK" : "—"],
    ["Fase", "na", phase === "down" ? "flexionado" : "extendido"]
  ]);
}

function evalFree(lm, s){
  const knee = angle(lm[s.hip], lm[s.kn], lm[s.an]), elbow = angle(lm[s.sh], lm[s.el], lm[s.wr]);
  const hip = angle(lm[s.sh], lm[s.hip], lm[s.kn]);
  $("angle").textContent = Math.round(knee) + "°"; $("angleLbl").textContent = "Ángulo rodilla";
  setCue("Modo libre", "");
  setChecks([["Codo", "na", Math.round(elbow) + "°"], ["Cadera", "na", Math.round(hip) + "°"], ["Rodilla", "na", Math.round(knee) + "°"]]);
}

// ---------- Dibujo ----------
function draw(lm){
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const bone = getComputedStyle(document.documentElement).getPropertyValue("--bone").trim() || "#ff7a3d";
  ctx.lineWidth = Math.max(3, w / 160); ctx.strokeStyle = bone; ctx.lineCap = "round";
  for (const [a, b] of BONES) {
    if ((lm[a].visibility ?? 1) < 0.4 || (lm[b].visibility ?? 1) < 0.4) continue;
    ctx.beginPath(); ctx.moveTo(lm[a].x * w, lm[a].y * h); ctx.lineTo(lm[b].x * w, lm[b].y * h); ctx.stroke();
  }
  ctx.fillStyle = "#ffffff";
  for (const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]) {
    if ((lm[i].visibility ?? 1) < 0.4) continue;
    ctx.beginPath(); ctx.arc(lm[i].x * w, lm[i].y * h, Math.max(4, w / 140), 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- Bucle ----------
let lastT = -1;
function loop(){
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const res = landmarker.detectForVideo(video, performance.now());
    const lm = res.landmarks && res.landmarks[0];
    const now = performance.now();
    if (lm) {
      draw(lm);
      const s = bestSide(lm);
      if (gate(lm, s, now)) {
        if (mode === "squat") evalSquat(lm, s, now); else if (mode === "tri") evalTri(lm, s, now); else evalFree(lm, s);
      }
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (mode === "free") setCue("No te veo", "warn"); else markLost(now);
    }
  }
  requestAnimationFrame(loop);
}

async function init(){
  try {
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate: "GPU" },
      runningMode: "VIDEO", numPoses: 1
    });
    statusEl.textContent = "Modelo listo.";
  } catch (e) {
    statusEl.textContent = "No se pudo cargar el modelo. Revisa la conexión a internet y recarga.";
    console.error(e);
  }
}

$("startBtn").addEventListener("click", async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    $("overlayText").textContent = "Este navegador no permite usar la cámara aquí. Ábrelo en Chrome o Safari.";
    return;
  }
  if (!landmarker) { $("overlayText").textContent = "El modelo aún está cargando, espera unos segundos."; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    $("overlay").hidden = true; running = true; say("Cámara lista"); loop();
    try { await navigator.wakeLock?.request("screen"); } catch {}
  } catch (e) {
    $("overlayText").textContent = "No se pudo acceder a la cámara. Permite el acceso en el navegador e inténtalo de nuevo.";
  }
});

document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".modes button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("modeHint").textContent = HINTS[mode]; resetState(); setCue("—", "");
}));
$("resetBtn").addEventListener("click", () => { resetState(); setCue("—", ""); });
$("voiceBtn").addEventListener("click", e => {
  voice = !voice; e.currentTarget.textContent = "Voz: " + (voice ? "sí" : "no");
  e.currentTarget.setAttribute("aria-pressed", String(voice));
});

$("modeHint").textContent = HINTS[mode];
setChecks([["Esperando cámara", "na", "—"]]);
init();
</script>
</body>
</html>
